spring:
  application:
    name: url-shortener
  datasource:
    # In-memory H2 in PostgreSQL compatibility mode. Prototype only; see docs/persistence.md.
    url: jdbc:h2:mem:urlshortener;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies that entities match it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

app:
  shortener:
    base-url: ${APP_BASE_URL:http://localhost:8080}
    own-hosts: ${APP_OWN_HOSTS:localhost,127.0.0.1,[::1]}
    max-attempts: 10
    max-url-length: 2048

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
